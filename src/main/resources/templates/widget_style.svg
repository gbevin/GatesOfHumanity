        text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: white; }
        .label { font-size: 11px; font-weight: 700; }
        .name { font-weight: 700; }
        .figure { font-weight: 700; }
        .quiet { fill: #b9b9d6; }
        .gold { fill: #e3a83c; }
        .lit { fill: #e3a83c; }
        .unlit { fill: #6f6fa0; }
        .end text { text-anchor: end; }