<svg version="1.1" width="338" height="354" viewBox="0 0 338 354" xmlns="http://www.w3.org/2000/svg">
    <title><!--v title-->The Body Graph Now<!--/v--></title>
    <style>
<!--i widget_style/-->
<!--i widget_bodygraph_style/-->
        .small-off { display: none; }
        rect.small-on { fill: #151533; }
        text.small-on { fill: white; font-size: 15px; font-weight: 700; text-anchor: middle; }
    </style>
<!--i widget_sky/-->
    <rect id="background" width="338" height="354" rx="14" fill="url(#sky)"/>
