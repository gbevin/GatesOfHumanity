        <g class="{{v graph}}{{/v}}" transform="translate(-51.3 -37.7) scale(0.459)">
<!--i widget_bodygraph_cone/-->
<!--i bodygraph/-->
        </g>
        <text class="label quiet" x="18" y="31"><!--v heading-->CHANNELS NOW<!--/v--></text>
        <text class="quiet" x="320" y="31" font-size="11" text-anchor="end"><!--v centers/--> <!--v centers_are-->defined<!--/v--></text>
        <!--v channels--><!--/v-->
    </a>
</svg>
<!--b channel_1--><g transform="translate(18, 58)"><!--v row/--></g><!--/b-->
