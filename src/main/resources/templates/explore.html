<!--v summary--><!--/v--><h2>Explore this <!--v subject-->chart<!--/v--></h2>
<p class="explore-intro"><!--v tap/--></p>
<details class="explore-guide">
    <summary>How to read this <!--v subject/--></summary>
    <h3 class="explore-guide-title"><!--v guide-title/--></h3>
    <p class="explore-guide-text"><!--v purpose/--> <a href="{{v purpose-url/}}">More about this <!--v subject/--></a></p>
    <h3 class="explore-guide-title">Human Design</h3>
    <p class="explore-guide-text"><!--v intro/--></p>
    <h3 class="explore-guide-title">Reading the <!--v subject/--></h3>
    <!--v introductions/-->
    <h3 class="explore-guide-title">Parts of the <!--v subject/--></h3>
    <div class="explore-items"><!--v guide/--></div>
</details>
<!--b summary--><!--i wheel_summary/--><!--/b-->
<!--b introduction-->
    <p class="explore-guide-text"><!--v text/--></p>
<!--/b-->
<!--v sections--><!--/v-->
<!--b section-->
<h3><!--v section-title/--></h3>
<div class="explore-items"><!--v items/--></div>
<!--/b-->
<!--b section-introduced-->
<details class="explore-about">
    <summary><h3><!--v section-title/--></h3><span class="explore-about-icon" aria-hidden="true">?</span></summary>
    <!--v section-intro/-->
</details>
<div class="explore-items"><!--v items/--></div>
<!--/b-->
<!--b section-introduction-->
<p class="explore-section-intro"><!--v text/--></p>
<!--/b-->
<!--b item-->
<details data-part="{{v part/}}" data-related="{{v related/}}">
    <summary><span class="explore-label"><!--v label/--></span> <span class="explore-value"><!--v value/--></span><!--v timeline/--></summary>
    <!--v paragraphs/-->
</details>
<!--/b-->
<!--b timeline-->
<span class="explore-timeline" aria-hidden="true"><span class="explore-timeline-range" style="left: {{v timeline-left/}}%; width: {{v timeline-width/}}%;"></span></span>
<!--/b-->
<!--b timeline-axis-->
<div class="explore-timeline-axis" aria-hidden="true"><span><!--v axis-earlier/--></span><span><!--v axis-birth/--></span><span><!--v axis-later/--></span></div>
<!--/b-->
<!--b more-paragraph-->
    <p class="explore-more"><a href="{{v more-url/}}"><!--v more-text/--></a></p>
<!--/b-->
<!--b labeled-paragraph-->
    <p><span class="explore-paragraph-label"><!--v text-label/--></span> <!--v text/--></p>
<!--/b-->
<!--b moment-paragraph-->
    <p class="explore-show"><button type="button" onclick="return showDate('{{v moment/}}', image_url);">Show the transits of that moment</button></p>
<!--/b-->
